<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>MonStoreLab — лаборатория внимания</title>
    <meta
      name="description"
      content="Прогноз внимания покупателя к обложкам товаров для Wildberries и Ozon: тепловая карта, метрики, тест среди конкурентов."

    <meta property="og:title" content="MonStoreLab — лаборатория внимания" />

    <meta property="og:url" content="https://monstorelab.ru/" />
    <!-- тема до загрузки CSS, чтобы страница не мигала (отдельный файл — CSP запрещает встроенные скрипты) -->
    <script src="/theme.js"></script>
  </head>
  <body>
    <noscript>Для работы MonStoreLab нужен JavaScript.</noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
