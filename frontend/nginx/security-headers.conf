# Заголовки безопасности — подключаются на уровне server и в каждой локации со своим add_header
# (в nginx add_header внутри location отменяет заголовки уровня server).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Браузер ходит на сайт только по HTTPS (по HTTP заголовок браузеры игнорируют — локальный запуск не ломается)
add_header Strict-Transport-Security "max-age=31536000" always;
# Только свои скрипты: даже если в страницу попадёт чужой код, он не запустится и не унесёт токен входа.
# style 'unsafe-inline' — для атрибутов style у Vue; blob:/data: — превью загруженных обложек.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
