# Заголовки безопасности — подключаются на уровне server и в каждой локации со своим add_header
# (в nginx add_header внутри location отменяет заголовки уровня server).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Браузер ходит на сайт только по HTTPS (по HTTP заголовок браузеры игнорируют — локальный запуск не ломается)
add_header Strict-Transport-Security "max-age=31536000" always;
# Только свои скрипты и Яндекс Метрика (грузится лишь после согласия на cookie): даже если в страницу попадёт
# чужой код, он не запустится и не унесёт токен входа. Адреса Метрики — по её справке (install-counter-csp).
# style 'unsafe-inline' — для атрибутов style у Vue; blob:/data: — превью загруженных обложек.
# frame-ancestors вместо X-Frame-Options: свой сайт и плеер Вебвизора/карты кликов в интерфейсе Метрики.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://mc.yandex.ru https://yastatic.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://mc.yandex.ru https://mc.yandex.com; font-src 'self' data:; connect-src 'self' blob: data: https://mc.yandex.ru https://mc.yandex.com wss://mc.yandex.ru wss://mc.yandex.com https://mc.webvisor.com https://mc.webvisor.org wss://mc.webvisor.com wss://mc.webvisor.org; frame-src https://mc.yandex.ru https://mc.yandex.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://metrika.yandex.ru https://metrika.yandex.com https://metrika.ya.ru https://metrica.yandex.ru https://metrica.yandex.com https://metrica.ya.ru https://analytics.yandex.ru https://metr.yandex.ru" always;
