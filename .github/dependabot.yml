version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      frontend:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /tools/covers
    schedule:
      interval: monthly

  - package-ecosystem: pip
    directory: /tools/covers
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
