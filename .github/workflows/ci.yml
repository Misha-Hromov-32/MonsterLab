name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Бэкенд — ruff, формат, pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . ../tools  # правила — в backend/pyproject.toml
      - run: ruff format --check . ../tools
      - run: pytest

  frontend:
    name: Фронтенд — типы, формат, сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  docker:
    name: Docker-образы (без нейросети)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      # лёгкий образ: полная сборка с весами DeepGaze качает ~1.5 ГБ, для проверки Dockerfile хватает NEURAL=0
      - run: NEURAL=0 docker compose build
      - name: Смоук-тест
        run: |
          NEURAL=0 docker compose up -d --wait  # ждёт healthcheck обоих сервисов
          curl -fsS http://localhost:8080/api/health
          curl -fsS http://localhost:8080/ | grep -q '<div id="app">'
      - if: always()
        run: docker compose logs; docker compose down -v
